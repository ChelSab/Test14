name: Build Windows Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  pyinstaller:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt

      - name: Build standalone executable
        run: |
          pyinstaller installer/ActiveRecallPDF.spec --noconfirm

      - name: Upload PyInstaller dist folder
        uses: actions/upload-artifact@v4
        with:
          name: ActiveRecallPDF-exe
          path: dist/ActiveRecallPDF/
          if-no-files-found: error

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          iscc installer\\ActiveRecallPDF.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ActiveRecallPDF-installer
          path: dist/ActiveRecallPDFInstaller.exe
          if-no-files-found: error
